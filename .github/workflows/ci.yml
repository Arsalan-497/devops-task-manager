name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: taskmanager
          POSTGRES_USER: taskmanager
          POSTGRES_PASSWORD: taskmanager_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taskmanager -d taskmanager"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django checks
        env:
          POSTGRES_DB: taskmanager
          POSTGRES_USER: taskmanager
          POSTGRES_PASSWORD: taskmanager_password
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: 5432
        run: python manage.py check

      - name: Run tests
        env:
          POSTGRES_DB: taskmanager
          POSTGRES_USER: taskmanager
          POSTGRES_PASSWORD: taskmanager_password
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: 5432
        run: python manage.py test

  docker:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t arsalkhan497/devops-task-manager:latest \
            -t arsalkhan497/devops-task-manager:${{ github.sha }} \
            .

      - name: Push Docker images
        run: |
          docker push arsalkhan497/devops-task-manager:latest
          docker push arsalkhan497/devops-task-manager:${{ github.sha }}